name: Daily ingest

on:
  schedule:
    # GitHub cron is in UTC. 22:17 UTC = 06:17 PHT. Off the hour on purpose:
    # GitHub's runners are busiest at :00, and scheduled runs there get delayed or dropped.
    - cron: "17 22 * * *"
  workflow_dispatch: # adds a "Run workflow" button, for re-runs and testing
    inputs:
      fire_drill:
        description: "Fail on purpose to test the Discord alert"
        type: boolean
        default: false

permissions:
  contents: read # this job only reads the repo

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a normal run takes ~1 minute; a hang should fail, not sit for 6 hours

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip # reuses downloaded packages between runs

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Fire drill (only when requested)
        if: ${{ inputs.fire_drill }}
        run: |
          echo "Failing on purpose to test the alert"
          exit 1

      - name: Fetch, clean and load the last 7 days
        run: python -m pipeline.ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Runs only if any step above failed, including checkout or pip install.
      # Plain curl, so it works even when Python or the dependencies are broken.
      - name: Alert Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg content "❌ **Daily ingest failed.** Logs: ${RUN_URL}" '{content: $content}' \
            | curl --fail --silent --show-error -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
